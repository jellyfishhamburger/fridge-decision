<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录与家庭 · Fridge Decision</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="ds.css?v=20261101-3">
<link rel="stylesheet" href="nav.css?v=20261101-3">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    font-size:15px;line-height:1.55;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(14px + env(safe-area-inset-top)) 18px 10px;background:var(--bg)}
  .top h1{margin:0;flex:1;font-family:var(--font-display);font-size:var(--fs-h1);font-weight:600}
  .top a{width:34px;height:34px;border-radius:var(--r-pill);display:grid;place-items:center;
    text-decoration:none;color:var(--muted);background:var(--card);border:1px solid var(--line)}
  .wrap{max-width:520px;margin:0 auto;padding:6px 18px 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
    padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(47,60,45,.04)}
  h2{margin:0 0 4px;font-family:var(--font-display);font-size:18px;font-weight:600}
  .lede{margin:0 0 12px;font-size:13px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .inp{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--bg);font:inherit;color:var(--ink)}
  .inp:focus{outline:2px solid var(--sage);outline-offset:1px}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;
    margin-top:12px;padding:12px 16px;border:0;border-radius:var(--r-sm);cursor:pointer;
    font:inherit;font-weight:600;text-decoration:none;
    transition:transform .12s var(--ease)}
  .btn:active{transform:scale(.985)}
  .btn.primary{color:#fff;background:linear-gradient(180deg,var(--action-hi),var(--action));
    box-shadow:0 8px 18px -10px rgba(47,107,79,.55)}
  .btn.ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
  .btn:disabled{opacity:.55}
  .msg{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--green)}
  .code{display:flex;align-items:center;gap:10px;margin-top:6px}
  .code b{font-size:22px;letter-spacing:.16em;font-family:var(--font-display)}
  .code button{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
    border-radius:var(--r-pill);padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px dashed var(--line-soft);font-size:13.5px}
  .kv:last-child{border:0}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:600;word-break:break-all;text-align:right}
  .hide{display:none!important}
  .note{font-size:11.5px;color:var(--muted-2);margin-top:10px;line-height:1.5}
  .avat{width:44px;height:44px;border-radius:var(--r-pill);background:var(--sage-bg);
    display:grid;place-items:center;color:var(--sage-dk);font-weight:700;font-size:16px;flex:none}
  .who{display:flex;align-items:center;gap:12px}
  .tabs{display:flex;gap:6px;background:var(--card-2);border-radius:var(--r-pill);padding:4px;margin:2px 0 6px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
    font-weight:600;padding:9px 10px;border-radius:var(--r-pill);cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(47,60,45,.10)}
</style>
</head>
<body>

<header class="top">
  <h1>登录与家庭</h1>
  <a href="settings.html" aria-label="返回设置">✕</a>
</header>

<main class="wrap">

  <!-- 没配置 Supabase -->
  <section class="card hide" id="cardNoCfg">
    <h2>还没连上云端</h2>
    <p class="lede">登录要先用 Supabase 的 URL 和 anon key。去设置页填好，再回来。</p>
    <a class="btn ghost" href="settings.html">去设置</a>
  </section>

  <!-- 登录 -->
  <section class="card" id="cardSignIn">
    <h2>登录</h2>
    <p class="lede">用邮箱加密码最稳；也可以发一条邮件链接，不用记密码。</p>

    <div class="tabs" id="authTabs">
      <button type="button" data-m="pw" class="on">用密码</button>
      <button type="button" data-m="link">发邮件链接</button>
    </div>

    <label for="email">邮箱</label>
    <input class="inp" id="email" type="email" inputmode="email" autocomplete="email"
           placeholder="you@example.com">

    <div id="pwWrap">
      <label for="pw">密码</label>
      <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="至少 6 位">
      <button class="btn primary" id="pwGo">登录 / 首次自动注册</button>
    </div>

    <div id="linkWrap" class="hide">
      <button class="btn primary" id="sendLink">发登录链接</button>
    </div>

    <div class="msg" id="signMsg"></div>
    <p class="note">家里其他人各用自己的邮箱注册，然后用邀请码加入同一个家。密码登录不依赖邮件额度。</p>
  </section>

  <!-- 已登录、还没有家庭 -->
  <section class="card hide" id="cardNoHome">
    <h2>你在哪一家？</h2>
    <p class="lede">冰箱里的东西属于「一个家」。你可以新建一个，或者用家人给的邀请码加入。</p>

    <label for="hhName">给这个家起个名字</label>
    <input class="inp" id="hhName" placeholder="我的家">
    <button class="btn primary" id="createHome">建一个家</button>

    <div style="height:10px"></div>
    <label for="joinCode">或者，用邀请码加入</label>
    <input class="inp" id="joinCode" placeholder="6 位邀请码，例如 ABC123"
           autocapitalize="characters" maxlength="8">
    <button class="btn ghost" id="joinHome">加入这个家</button>
    <div class="msg" id="homeMsg"></div>
  </section>

  <!-- 已登录 + 有家庭 -->
  <section class="card hide" id="cardHome">
    <div class="who">
      <span class="avat" id="avatar">P</span>
      <div style="min-width:0">
        <h2 style="margin-bottom:2px" id="hhTitle">我的家</h2>
        <p class="lede" style="margin:0" id="whoEmail">—</p>
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="kv"><span>邀请码</span><span id="hhCode">—</span></div>
      <div class="kv"><span>我的身份</span><span id="hhRole">—</span></div>
      <div class="kv"><span>云端库存</span><span id="hhStock">—</span></div>
    </div>

    <div class="code">
      <button id="copyCode">复制邀请码</button>
      <button id="reload">刷新</button>
    </div>

    <button class="btn ghost" id="migrate">把本机库存搬进这个家</button>
    <a class="btn primary" href="index.html#fridge">去冰箱看看</a>
    <button class="btn ghost" id="signOut">退出登录</button>
    <p class="note">把这个邀请码发给家人，他们在自己的手机上登录后填一次，就共用同一个冰箱。</p>
  </section>

  <p class="note" id="footNote"></p>
</main>

<nav class="nav">
  <div class="navin">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 11.4 12 4.4l8.2 7"/><path d="M6.3 10.2v9.2h11.4v-9.2"/><path d="M10 19.4v-4.6h4v4.6"/></svg><span>首页</span></a>
    <a href="index.html#fridge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="3.2" width="12" height="17.6" rx="2.6"/><path d="M6 9.6h12M9 5.6v2M9 11.8v2.4"/></svg><span>冰箱</span></a>
    <a href="index.html#discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.6C10.2 5.3 7.7 4.8 5 5.1v12.4c2.7-.3 5.2.2 7 1.5 1.8-1.3 4.3-1.8 7-1.5V5.1c-2.7-.3-5.2.2-7 1.5z"/><path d="M12 6.6v12.4"/></svg><span>菜谱</span></a>
    <a href="cook.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 10.4h16.8c0 4.6-3 7.2-6.6 7.2H10.2c-3.6 0-6.6-2.6-6.6-7.2z"/><path d="M2 9.8h20"/><path d="M6 9.8V8.2M18 9.8V8.2"/><path d="M9.4 5.4c-.8-1 .6-1.6 0-2.6M14.6 5.4c-.8-1 .6-1.6 0-2.6"/></svg><span>自己选</span></a>
    <a class="on" href="settings.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.1"/><circle cx="15.5" cy="17" r="2.1"/></svg><span>设置</span></a>
  </div>
</nav>

<script src="data.js?v=20261101-1"></script>
<script src="logic.js?v=20261101-1"></script>
<script src="sync.js?v=20261101-1"></script>
<script src="auth.js?v=20261101-3"></script>
<script src="nav.js?v=20261101-1" defer></script>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  function show(id){
    ["cardNoCfg","cardSignIn","cardNoHome","cardHome"].forEach(function(k){
      $("#"+k).classList.toggle("hide", k !== id);
    });
  }
  function msg(el, text, cls){ el.textContent = text || ""; el.className = "msg" + (cls ? " " + cls : ""); }

  var hh = null;

  async function paint(){
    if(!AUTH.configured()){ show("cardNoCfg"); $("#footNote").textContent = "没有 Supabase 配置时，所有数据只存在这台设备。"; return; }
    if(!AUTH.signedIn()){ show("cardSignIn"); $("#footNote").textContent = "登录只用于多设备共享；不登录也能用，数据在本机。"; return; }

    var s = AUTH.session();
    $("#whoEmail").textContent = s.email || s.user_id || "已登录";
    $("#avatar").textContent = (s.email || "P").slice(0,1).toUpperCase();

    hh = await AUTH.myHousehold();
    if(!hh){ show("cardNoHome"); $("#footNote").textContent = "你还没有加入任何家庭。"; return; }

    $("#hhTitle").textContent = hh.name || "我的家";
    $("#hhCode").textContent = hh.join_code || "—";
    $("#hhRole").textContent = hh.role === "owner" ? "创建者" : "成员";
    show("cardHome");
    $("#footNote").textContent = "";

    try{
      var rows = await AUTH.items();
      $("#hhStock").textContent = Array.isArray(rows) ? (rows.length + " 样") : "读不到（RLS 未开或未授权）";
    }catch(e){ $("#hhStock").textContent = "读不到"; }
  }

  /* 从邮箱点回来时，URL 里带着 token */
  var red = AUTH.handleRedirect();
  if(red && red.error) {
    show("cardSignIn");
    msg($("#signMsg"), "登录失败：" + red.error, "err");
  }

  /* 两个模式切换 */
  $("#authTabs").addEventListener("click", function(e){
    var b = e.target.closest("[data-m]"); if(!b) return;
    [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x === b); });
    var pw = b.dataset.m === "pw";
    $("#pwWrap").classList.toggle("hide", !pw);
    $("#linkWrap").classList.toggle("hide", pw);
    msg($("#signMsg"), "");
  });

  function friendly(err){
    var m = String(err && err.message || err || "");
    if (/rate limit|429/i.test(m)) return "邮件额度用完了（Supabase 自带邮件每小时只发 2 封）。先用密码登录，或者等一小时。";
    if (/Invalid login credentials/i.test(m)) return "邮箱或密码不对。";
    if (/already registered|already exists/i.test(m)) return "这个邮箱注册过了 —— 密码可能记错了。";
    if (/Email not confirmed/i.test(m)) return "项目还开着「确认邮箱」，得先去邮箱点确认（或者让我把它关掉）。";
    if (/Password should be/i.test(m)) return "密码至少 6 位。";
    return m;
  }

  $("#pwGo").addEventListener("click", async function(){
    var email = ($("#email").value || "").trim();
    var pw = ($("#pw").value || "");
    if(!/.+@.+\..+/.test(email)){ msg($("#signMsg"), "邮箱看起来不对。", "err"); return; }
    if(pw.length < 6){ msg($("#signMsg"), "密码至少 6 位。", "err"); return; }
    this.disabled = true; msg($("#signMsg"), "正在登录…");
    try{
      var r = await AUTH.signInOrSignUp(email, pw);
      if(r.needsConfirm){
        msg($("#signMsg"), "账号建好了，但项目要求先确认邮箱 —— 去收件箱点确认，或者把「Confirm email」关掉。", "err");
        return;
      }
      msg($("#signMsg"), r.created ? "账号已创建，正在进入…" : "登录成功，正在进入…", "ok");
      setTimeout(paint, 300);
    }catch(e){
      msg($("#signMsg"), "登录不了：" + friendly(e), "err");
    }finally{ this.disabled = false; }
  });

  $("#sendLink").addEventListener("click", async function(){
    var email = ($("#email").value || "").trim();
    if(!/.+@.+\..+/.test(email)){ msg($("#signMsg"), "邮箱看起来不对。", "err"); return; }
    this.disabled = true; msg($("#signMsg"), "正在发送…");
    try{
      await AUTH.signIn(email);
      msg($("#signMsg"), "链接已经发出，去邮箱点一下（可能在垃圾邮件里）。", "ok");
    }catch(e){
      msg($("#signMsg"), "发不出去：" + friendly(e), "err");
    }finally{ this.disabled = false; }
  });

  $("#createHome").addEventListener("click", async function(){
    this.disabled = true; msg($("#homeMsg"), "正在创建…");
    try{
      await AUTH.createHousehold(($("#hhName").value || "").trim() || "我的家");
      await paint();
    }catch(e){ msg($("#homeMsg"), "建不了：" + e.message, "err"); }
    finally{ this.disabled = false; }
  });

  $("#joinHome").addEventListener("click", async function(){
    var code = ($("#joinCode").value || "").trim().toUpperCase();
    if(code.length < 4){ msg($("#homeMsg"), "邀请码是 6 位。", "err"); return; }
    this.disabled = true; msg($("#homeMsg"), "正在加入…");
    try{
      await AUTH.joinHousehold(code);
      await paint();
    }catch(e){ msg($("#homeMsg"), "加不进去：" + e.message, "err"); }
    finally{ this.disabled = false; }
  });

  $("#copyCode").addEventListener("click", function(){
    var c = hh && hh.join_code; if(!c) return;
    (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject())
      .then(function(){ msg($("#footNote"), "邀请码已复制", "ok"); })
      .catch(function(){ msg($("#footNote"), "复制不了，手动记一下：" + c); });
  });
  $("#reload").addEventListener("click", paint);

  /* 本机 → 云端：把手机上已有的库存逐条写进当前家庭（add_item 幂等，重跑不会重复） */
  $("#migrate").addEventListener("click", async function(){
    var local = [];
    try { local = (window.FD && FD.items()) || []; } catch(e) { local = []; }
    if(!local.length){ msg($("#footNote"), "这台手机上没有可搬的库存。", "err"); return; }
    this.disabled = true;
    var ok = 0, fail = 0;
    for (var i = 0; i < local.length; i++) {
      var it = local[i];
      try {
        await AUTH.rpc("add_item", {
          p_cat: it.cat, p_name: it.name, p_tag: it.tag, p_qty: it.qty || 1,
          p_unit: it.unit, p_life: it.life, p_days_left: it.daysLeft,
          p_date_source: "migrated", p_key: "migrate:" + it.id, p_id: it.id
        });
        ok++;
        msg($("#footNote"), "正在搬 " + ok + "/" + local.length + "…");
      } catch(e) { fail++; }
    }
    msg($("#footNote"), "搬完 " + ok + " 样" + (fail ? "，失败 " + fail + " 样（看控制台）" : "") + "。刷新看结果。", fail ? "err" : "ok");
    this.disabled = false;
    setTimeout(paint, 600);
  });
  $("#signOut").addEventListener("click", function(){ AUTH.signOut(); paint(); });

  paint();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1613">
<title>拍样本 · 训练数据采集</title>
<style>
  :root{ --bg:#0d1613; --card:#14211c; --line:#22302a; --ink:#e7f1ea; --muted:#8fa89b;
         --green:#1d8f68; --green-soft:#12281f; --amber:#e0a33e; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 110px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
  h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;
    text-align:center;font-size:13px;color:var(--ink);cursor:pointer;position:relative;user-select:none}
  .cls .n{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .cls.on{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}
  .cls.done .n{color:var(--green);font-weight:700}
  .shoot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(13,22,19,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .row{display:flex;gap:8px;align-items:center}
  button{font:inherit;border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
  .primary{background:var(--green);color:#fff;font-weight:700;flex:1}
  .primary:disabled{background:#243029;color:#5d6d64}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;padding:11px 13px}
  .hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .thumb{position:relative}
  .thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#0a1210;display:block}
  .thumb button{position:absolute;top:-5px;right:-5px;background:#b3261e;color:#fff;border-radius:999px;
    width:20px;height:20px;padding:0;font-size:12px;line-height:20px;text-align:center}
  .empty{font-size:12.5px;color:var(--muted);padding:10px 0}
  .bar{height:4px;background:#1b2a24;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--green);width:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>拍样本</h1>
  <p class="sub">选品类 → 拍照 → 自动存好。目标：每类 20 张，按你平时放东西的姿势拍。</p>

  <h2>1. 选品类</h2>
  <div class="grid" id="classes"></div>

  <h2>2. 拍（<span id="cnt">0</span> / <span id="total">0</span> 张）</h2>
  <div class="bar"><i id="prog"></i></div>
  <div class="thumbs" id="thumbs"></div>
  <p class="hint" id="tip">先选一个品类，再点下面的「拍一张」。选「不认识」就拍水果、包装食品、饮料这类。</p>

  <h2>怎么拍（重要）</h2>
  <p class="hint" style="line-height:1.75">
    · 手机举高，俯拍，跟你平时往冰箱里放东西的视角一样<br>
    · 东西拿在手里，让它占画面 1/4 到 1/3，不要怼满<br>
    · 背景要带上：冰箱内壁 / 蛋托 / 塑料袋 —— 这些正是模型现在认错的东西<br>
    · 每类拍 20 张：换 3 个角度、2 种光线（开灯/关灯）、有的清楚有的稍微糊<br>
    · 拍完点右下角「导出 ZIP」，把文件发我
  </p>
</div>

<div class="shoot">
  <div class="row">
    <button class="ghost" id="exportBtn">导出 ZIP</button>
    <button class="primary" id="shootBtn" disabled>拍一张</button>
  </div>
  <p class="hint" id="status">还没有照片</p>
</div>

<input id="file" type="file" accept="image/*" capture="environment" style="display:none">

<script>
const CLASSES = [
  ["chili", "青椒"], ["egg", "鸡蛋"], ["greens", "青菜"], ["milk", "牛奶"],
  ["mushroom", "香菇"], ["pork", "猪肉"], ["tofu", "豆腐"], ["tomato", "番茄"],
  ["unknown", "不认识"]
];
const TARGET = 20;
const DB = "fd_samples", STORE = "shots";
let db = null, current = null, shots = [];

function $(s){ return document.querySelector(s); }

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id", autoIncrement: true});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode){ return db.transaction(STORE, mode).objectStore(STORE); }
function addShot(rec){ return new Promise((res, rej) => { const q = tx("readwrite").add(rec); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function allShots(){ return new Promise((res, rej) => { const q = tx("readonly").getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
function delShot(id){ return new Promise((res) => { const q = tx("readwrite").delete(id); q.onsuccess = () => res(); }); }

function renderClasses(){
  const box = $("#classes"); box.innerHTML = "";
  CLASSES.forEach(([id, name]) => {
    const n = shots.filter(s => s.label === id).length;
    const el = document.createElement("div");
    el.className = "cls" + (current === id ? " on" : "") + (n >= TARGET ? " done" : "");
    el.dataset.id = id;
    el.innerHTML = `${name}<span class="n">${n}/${TARGET}</span>`;
    el.addEventListener("pointerdown", e => { e.preventDefault(); current = id; renderClasses(); paintShoot(); });
    box.appendChild(el);
  });
}

function paintShoot(){
  $("#shootBtn").disabled = !current;
  $("#total").textContent = shots.length;
  $("#cnt").textContent = shots.filter(s => s.label === current).length;
  const n = current ? shots.filter(s => s.label === current).length : 0;
  $("#prog").style.width = Math.min(100, (n / TARGET) * 100) + "%";
  const name = (CLASSES.find(c => c[0] === current) || [])[1];
  $("#tip").textContent = current
    ? `正在拍：${name}（已 ${n} 张）`
    : "先选一个品类，再点下面的「拍一张」。选「不认识」就拍水果、包装食品、饮料这类。";
}

function renderThumbs(){
  const box = $("#thumbs");
  const mine = shots.filter(s => s.label === current).slice(-8).reverse();
  box.innerHTML = "";
  if(!mine.length){ box.innerHTML = '<div class="empty">这一类还没有照片</div>'; return; }
  mine.forEach(s => {
    const d = document.createElement("div"); d.className = "thumb";
    const img = document.createElement("img");
    img.src = URL.createObjectURL(s.blob);
    const x = document.createElement("button"); x.textContent = "×";
    x.addEventListener("pointerdown", async e => {
      e.preventDefault();
      await delShot(s.id); shots = shots.filter(t => t.id !== s.id);
      renderClasses(); paintShoot(); renderThumbs();
    });
    d.appendChild(img); d.appendChild(x); box.appendChild(d);
  });
}

/* 拍完压一下尺寸：1600px 长边、jpeg 0.85，既能训练也不占空间 */
function shrink(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 1600;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b), "image/jpeg", 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

$("#shootBtn").addEventListener("click", () => {
  if(!current) return;
  $("#file").value = "";
  $("#file").click();
});

$("#file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  $("#status").textContent = "保存中…";
  const blob = await shrink(f);
  const rec = {label: current, blob, ts: Date.now()};
  rec.id = await addShot(rec);
  shots.push(rec);
  renderClasses(); paintShoot(); renderThumbs();
  $("#status").textContent = `已保存 ${shots.length} 张`;
});

$("#exportBtn").addEventListener("click", async () => {
  if(!shots.length){ $("#status").textContent = "还没有照片"; return; }
  $("#status").textContent = "打包中…";
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
  await new Promise((res, rej) => { s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const zip = new JSZip();
  const counts = {};
  shots.forEach(sh => {
    counts[sh.label] = (counts[sh.label] || 0) + 1;
    const name = `${sh.label}_${String(counts[sh.label]).padStart(3, "0")}.jpg`;
    zip.file(name, sh.blob);
  });
  zip.file("labels.txt", CLASSES.map(c => c[0]).join("\n"));
  const blob = await zip.generateAsync({type: "blob"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "food_samples.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $("#status").textContent = `已导出 ${shots.length} 张 —— 把 food_samples.zip 发给老师/我`;
});

(async () => {
  db = await openDB();
  shots = await allShots();
  renderClasses(); paintShoot(); renderThumbs();
  $("#status").textContent = shots.length ? `已保存 ${shots.length} 张` : "还没有照片";
})();
</script>
</body>
</html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cooking Pebble 测试</title>
<style>body{font:18px system-ui;max-width:650px;margin:24px auto;padding:0 18px;background:#f5f4ed;color:#203b32}h1{font-size:28px}section{background:white;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select,button,textarea{font:inherit;box-sizing:border-box;padding:12px;width:100%;margin:5px 0;border:1px solid #aac1b2;border-radius:8px}button{background:#244f3d;color:white;cursor:pointer}button:disabled{opacity:.45}#step{font-size:28px;white-space:pre-wrap}#clock{font-size:42px;font-variant-numeric:tabular-nums}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}small{display:block;color:#53675d}textarea{height:140px}#message{white-space:pre-wrap}</style>
<h1>Cooking Pebble 测试</h1><p>独立测试环境 · 不扣库存</p>
<section id="login"><label>测试项目 Publishable／anon key<input id="key" type="password" autocomplete="off"></label><small>手机可以使用公开客户端key；不要填写service_role或secret key。</small><label>测试账号邮箱<input id="email" type="email" autocomplete="username"></label><label>测试账号密码<input id="password" type="password" autocomplete="current-password"></label><button id="sign-in">登录测试账号</button><button id="sign-out" hidden>退出登录</button></section>
<section><label>测试设备配置文件<input id="config" type="file" accept=".json"></label><small>只选择 pebble-phone-config.json；它不包含设备密钥。</small><label>菜谱<select id="recipe"></select></label><button id="start" disabled>发送菜谱到旋钮</button><p id="step">尚未连接会话</p><div id="clock">--:--</div><small id="count"></small><div class="controls"><button id="prev" disabled>上一步</button><button id="next" disabled>下一步</button><button id="timer" disabled>开始／暂停</button><button id="exit" disabled>结束会话</button></div></section>
<section id="membership" hidden><p>首次测试需把此账号加入独立测试家庭。在测试项目SQL Editor执行下列SQL，然后点击发送菜谱。</p><textarea id="membership-sql" readonly></textarea></section><p id="message" role="status">请先登录测试账号并选择配置文件。</p>
<script src="data.js"></script><script src="pebble-steps.js"></script><script src="pebble-phone.js"></script><script src="pebble-test.js"></script></html>
